<!doctype html>
<!-- Source for the Chrome Web Store promo tiles. Render at 440×280 (small) or 1400×560 (marquee). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Montserrat; src: url('../../public/fonts/montserrat-latin.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Montserrat, sans-serif; color: #fff; overflow: hidden;
    background: #7c5cff; display: flex; align-items: center; gap: 5.5vw; padding: 0 7vw; box-sizing: border-box;
  }
  .mark { flex: 0 0 auto; width: 22vh; height: 22vh; border-radius: 5vh; background: #fff; display: grid; place-items: center; box-shadow: 0 2vh 6vh rgba(30, 10, 90, .35); }
  .mark img { width: 72%; height: 72%; }
  h1 { margin: 0; font-size: 13vh; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  p { margin: 3vh 0 0; font-size: 6.2vh; font-weight: 500; line-height: 1.35; opacity: .92; }
  .chips { margin-top: 4vh; display: flex; gap: 1.6vh; flex-wrap: wrap; }
  .chips span { font-size: 4.4vh; font-weight: 650; padding: 1.1vh 2.4vh; border-radius: 99px; background: rgba(255, 255, 255, .18); }
</style>
</head>
<body>
  <div class="mark"><img src="../../public/icons/icon128.png" alt="" /></div>
  <div>
    <h1>Notely</h1>
    <p>Your private notepad,<br />one click away.</p>
    <div class="chips"><span>Rich text</span><span>Side panel</span><span>100% local</span></div>
  </div>
</body>
</html>
