<!doctype html>
<!-- Chrome Web Store small promo tile (render at 440×280). Keep text large: it's shown small. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Montserrat; src: url('../../../public/fonts/montserrat-latin.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { font-family: Montserrat, sans-serif; color: #fff; background: #7c5cff; display: flex; flex-direction: column; justify-content: center; padding: 0 34px; box-sizing: border-box; position: relative; }
  .row { display: flex; align-items: center; gap: 18px; }
  .mark { width: 74px; height: 74px; border-radius: 18px; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 26px rgba(30, 10, 90, .35); flex: 0 0 auto; }
  .mark img { width: 54px; height: 54px; }
  h1 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  p { margin: 7px 0 0; font-size: 16px; font-weight: 600; line-height: 1.3; opacity: .95; }
  .chips { display: flex; gap: 6px; margin-top: 20px; }
  .chips span { font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .2); white-space: nowrap; }
  .foot { position: absolute; left: 34px; bottom: 16px; font-size: 11px; font-weight: 600; opacity: .8; }
</style>
</head>
<body>
  <div class="row">
    <div class="mark"><img src="../../../public/icons/icon128.png" alt="" /></div>
    <div>
      <h1>Notely</h1>
      <p>Private notepad in your<br />side panel</p>
    </div>
  </div>
  <div class="chips"><span>Rich text</span><span>Web clipper</span><span>Open source</span></div>
  <div class="foot">♥ Sponsored by ToolEnhancer</div>
</body>
</html>
