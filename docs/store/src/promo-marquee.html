<!doctype html>
<!-- Chrome Web Store marquee promo tile (render at 1400×560). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Montserrat; src: url('../../../public/fonts/montserrat-latin.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body { font-family: Montserrat, sans-serif; color: #fff; background: #7c5cff; position: relative; }
  .text { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; align-items: center; gap: 22px; }
  .mark { width: 92px; height: 92px; border-radius: 24px; background: #fff; display: grid; place-items: center; box-shadow: 0 14px 34px rgba(30, 10, 90, .35); flex: 0 0 auto; }
  .mark img { width: 68px; height: 68px; }
  h1 { margin: 0; font-size: 68px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .tag { margin: 26px 0 0; font-size: 30px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
  .sub { margin: 12px 0 0; font-size: 19px; font-weight: 500; line-height: 1.45; opacity: .9; }
  .chips { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .chips span { font-size: 15px; font-weight: 700; padding: 7px 14px; border-radius: 99px; background: rgba(255, 255, 255, .2); }
  .foot { position: absolute; left: 80px; bottom: 26px; display: flex; gap: 22px; font-size: 14px; font-weight: 650; opacity: .9; }
  .shot {
    position: absolute; left: 700px; top: 70px; width: 820px; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 80px rgba(20, 8, 70, .5), 0 0 0 1px rgba(255, 255, 255, .25);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="text">
    <div class="row">
      <div class="mark"><img src="../../../public/icons/icon128.png" alt="" /></div>
      <h1>Notely</h1>
    </div>
    <div class="tag">Your private notepad,<br />right in the side panel.</div>
    <div class="sub">Rich text, Markdown shortcuts, checklists, web clipper and version history. Everything stays on your device.</div>
    <div class="chips"><span>100% local</span><span>No account</span><span>Open source</span></div>
  </div>
  <div class="foot"><span>github.com/Toolvanta/notely</span><span>♥ Sponsored by ToolEnhancer</span></div>
  <div class="shot"><img src="../../screenshots/editor-light.png" alt="" /></div>
</body>
</html>
